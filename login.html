<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in | Lyceum Education</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <main class="auth-shell">
        <a class="brand" href="index.html"><span class="brand-mark">L</span><span>Lyceum Education</span></a>
        <section class="auth-card">
            <p class="eyebrow">Welcome back</p>
            <h1>Return to your practice.</h1>
            <p class="auth-copy">Log in to keep your learning history and preferences with you.</p>
            <form id="login-form">
                <label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required>
                <label for="password">Password</label><div class="password-field"><input id="password" name="password" type="password" autocomplete="current-password" required><button class="password-toggle" type="button" data-password-toggle="#password">Show</button></div>
                <button class="primary-button" type="submit">Log in</button>
            </form>
            <p class="form-message" id="message" role="alert" hidden></p>
            <p class="auth-switch">New to Lyceum? <a href="signup.html">Create an account</a></p>
        </section>
    </main>
    <script src="auth.js"></script>
    <script>
        const form = document.querySelector("#login-form");
        const message = document.querySelector("#message");
        form.addEventListener("submit", async event => {
            event.preventDefault();
            try {
                await LyceumAuth.signIn(form.email.value.trim(), form.password.value);
                window.location.href = "index.html";
            } catch (error) { LyceumAuth.showMessage(message, error.message); }
        });
        document.querySelector("[data-password-toggle]").addEventListener("click", event => {
            const input = document.querySelector(event.currentTarget.dataset.passwordToggle);
            input.type = input.type === "password" ? "text" : "password";
            event.currentTarget.textContent = input.type === "password" ? "Show" : "Hide";
        });
    </script>
</body>
</html>
