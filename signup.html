<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create an account | Lyceum Education</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <main class="auth-shell">
        <a class="brand" href="index.html"><span class="brand-mark">L</span><span>Lyceum Education</span></a>
        <section class="auth-card">
            <p class="eyebrow">Make it yours</p>
            <h1>Build a practice memory.</h1>
            <p class="auth-copy">Choose the workspace that matches your role. You can join a class or connect a guardian account after signing up.</p>
            <form id="signup-form">
                <div class="form-grid"><div><label for="first-name">First name</label><input id="first-name" name="firstName" autocomplete="given-name" required></div><div><label for="last-name">Last name</label><input id="last-name" name="lastName" autocomplete="family-name" required></div></div>
                <label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required>
                <label for="role">I am signing up as</label>
                <select id="role" name="role" required>
                    <option value="student">Student</option>
                    <option value="educator">Educator</option>
                    <option value="guardian">Guardian</option>
                </select>
                <label for="password">Password</label><div class="password-field"><input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required><button class="password-toggle" type="button" data-password-toggle="#password">Show</button></div>
                <button class="primary-button" type="submit">Create account</button>
            </form>
            <p class="form-message" id="message" role="alert" hidden></p>
            <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
        </section>
    </main>
    <script src="auth.js"></script>
    <script>
        const form = document.querySelector("#signup-form");
        const message = document.querySelector("#message");
        form.addEventListener("submit", async event => {
            event.preventDefault();
            try {
                const data = new FormData(form);
                await LyceumAuth.signUp({ firstName: data.get("firstName"), lastName: data.get("lastName"), email: data.get("email"), password: data.get("password"), role: data.get("role") });
                window.location.href = "classroom.html";
            } catch (error) { LyceumAuth.showMessage(message, error.message); }
        });
        document.querySelector("[data-password-toggle]").addEventListener("click", event => {
            const input = document.querySelector(event.currentTarget.dataset.passwordToggle);
            input.type = input.type === "password" ? "text" : "password";
            event.currentTarget.textContent = input.type === "password" ? "Show" : "Hide";
        });
    </script>
</body>
</html>
